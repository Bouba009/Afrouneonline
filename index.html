    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --secondary: #ff6d00;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1a1a2e;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --white: #ffffff;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
            --radius: 12px;
            --radius-lg: 20px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        body.modal-open { overflow: hidden; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        
        .animate-fade { animation: fadeIn 0.5s ease; }
        .animate-slide-up { animation: slideUp 0.5s ease; }
        .animate-pulse { animation: pulse 2s infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        /* Toast */
        .toast-container {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 95%;
            width: 400px;
        }
        
        .toast {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-radius: var(--radius);
            color: var(--white);
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            animation: slideDown 0.3s ease;
        }
        
        .toast.success { background: linear-gradient(135deg, var(--success), #059669); }
        .toast.error { background: linear-gradient(135deg, var(--danger), #dc2626); }
        .toast.warning { background: linear-gradient(135deg, var(--warning), #d97706); }
        .toast.info { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
        
        .toast-icon {
            width: 35px;
            height: 35px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        
        .toast-close {
            margin-right: auto;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            opacity: 0.7;
            font-size: 1.2rem;
        }
        
        .toast-close:hover { opacity: 1; }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 12px 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .menu-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        
        .menu-btn:hover { background: rgba(255,255,255,0.25); }
        
        .logo {
            height: 45px;
            cursor: pointer;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 10px 16px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            position: relative;
        }
        
        .header-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }
        
        .header-btn.icon-only {
            padding: 10px;
            font-size: 1.1rem;
        }
        
        .header-btn .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            font-size: 0.7rem;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .lang-btn {
            background: white;
            color: var(--primary);
            font-weight: 700;
        }
        
        /* Side Menu */
        .side-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .side-overlay.open { opacity: 1; visibility: visible; }
        
        .side-menu {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            max-width: 85%;
            height: 100%;
            background: white;
            z-index: 201;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }
        
        .side-menu.open { right: 0; }
        
        .side-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 30px 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }
        
        .side-close {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .side-close:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }
        
        .side-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        
        .side-brand h3 { font-size: 1.1rem; }
        .side-brand p { font-size: 0.8rem; opacity: 0.8; }
        
        .side-user {
            display: none;
            padding: 15px 20px;
            background: var(--gray-100);
            gap: 12px;
            align-items: center;
        }
        
        .side-user.show { display: flex; }
        
        .side-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }
        
        .side-items {
            flex: 1;
            padding: 15px 0;
            overflow-y: auto;
        }
        
        .side-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: var(--gray-700);
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .side-item:hover {
            background: var(--gray-100);
            color: var(--primary);
            padding-right: 25px;
        }
        
        .side-item.active {
            background: rgba(26,115,232,0.1);
            color: var(--primary);
            border-right: 4px solid var(--primary);
        }
        
        .side-item i { width: 24px; text-align: center; font-size: 1.1rem; }
        
        .side-divider {
            height: 1px;
            background: var(--gray-200);
            margin: 10px 20px;
        }
        
        .side-item.logout { color: var(--danger); }
        
        /* Banner Slider */
        .banner-slider {
            position: relative;
            width: 100%;
            height: 350px;
            overflow: hidden;
            background: var(--dark);
        }
        
        .banner-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .banner-slide.active { opacity: 1; }
        
        .banner-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: white;
        }
        
        .banner-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        
        .banner-desc {
            font-size: 1rem;
            margin-bottom: 20px;
            opacity: 0.9;
            max-width: 500px;
        }
        
        .banner-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.9);
            color: var(--gray-800);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 1.1rem;
            transition: all 0.3s;
            z-index: 10;
        }
        
        .banner-nav:hover {
            background: white;
            transform: translateY(-50%) scale(1.1);
        }
        
        .banner-nav.prev { left: 15px; }
        .banner-nav.next { right: 15px; }
        
        .banner-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        
        .banner-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        
        .banner-dot.active {
            background: white;
            transform: scale(1.3);
        }
        
        /* Categories */
        .categories-section {
            padding: 40px 15px;
            background: white;
        }
        
        .section-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 30px;
            position: relative;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border-radius: 2px;
        }
        
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px 10px;
            background: var(--gray-100);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .category-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }
        
        .category-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }
        
        .category-card:hover .category-img {
            transform: scale(1.1);
            border-color: var(--primary);
        }
        
        .category-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark);
            text-align: center;
        }
        
        /* Ads Section */
        .ads-section {
            padding: 40px 15px;
        }
        
        .featured-section {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
        }
        
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .ad-card {
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .ad-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }
        
        .ad-card.featured { border: 3px solid var(--warning); }
        
        .ad-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, var(--warning), #f59e0b);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .ad-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            transition: transform 0.5s;
        }
        
        .ad-card:hover .ad-image { transform: scale(1.05); }
        
        .ad-content { padding: 15px; }
        
        .ad-category {
            display: inline-block;
            background: rgba(26,115,232,0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .ad-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .ad-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--success);
            margin-bottom: 8px;
        }
        
        .ad-location {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--gray-500);
            font-size: 0.85rem;
        }
        
        .ad-location i { color: var(--primary); }
        
        .ad-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-top: 1px solid var(--gray-200);
            background: var(--gray-100);
        }
        
        .ad-date {
            font-size: 0.8rem;
            color: var(--gray-500);
        }
        
        .ad-actions { display: flex; gap: 8px; }
        
        .ad-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .ad-action-btn:hover { transform: scale(1.15); }
        .ad-action-btn.msg { color: var(--primary); }
        .ad-action-btn.msg:hover { background: var(--primary); color: white; }
        .ad-action-btn.report { color: var(--danger); }
        .ad-action-btn.report:hover { background: var(--danger); color: white; }
        
        .section-more {
            text-align: center;
            margin-top: 30px;
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(26,115,232,0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26,115,232,0.4);
        }
        
        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }
        
        .btn-block { width: 100%; }
        .btn-lg { padding: 16px 32px; font-size: 1.1rem; }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        /* Floating Buttons */
        .floating-btns {
            position: fixed;
            bottom: 25px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 50;
        }
        
        .float-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            border: none;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s;
            opacity: 0.75;
        }
        
        .float-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        
        .float-btn.add {
            background: linear-gradient(135deg, var(--secondary), #e55a00);
            color: white;
        }
        
        .float-btn.filter {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }
        
        .float-btn.search {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.open { opacity: 1; visibility: visible; }
        
        .modal {
            background: white;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        
        .modal-overlay.open .modal { transform: scale(1); }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .modal-title i { color: var(--primary); }
        
        .modal-close {
            background: var(--gray-100);
            color: var(--gray-600);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        
        .modal-close:hover {
            background: var(--danger);
            color: white;
            transform: rotate(90deg);
        }
        
        .modal-body { padding: 20px; }
        
        /* Forms */
        .form-group { margin-bottom: 18px; }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.9rem;
        }
        
        .form-group label i {

        const loadAds = async () => {

        };
        
        const loadSliders = async () => {

                    db.collection('messages').where('receiverId', '==', state.user.uid).get()

        function navigateTo(page) {

        function getFilteredAds() {
            let ads = [...state.ads];
            if (state.filters.category) ads = ads.filter(a => a.category === state.filters.category);
            if (state.filters.city) ads = ads.filter(a => a.city === state.filters.city);
            if (state.filters.priceMin) ads = ads.filter(a => a.price >= parseInt(state.filters.priceMin));
            if (state.filters.priceMax) ads = ads.filter(a => a.price <= parseInt(state.filters.priceMax));
            if (state.filters.search) {
                const q = state.filters.search.toLowerCase();
                ads = ads.filter(a => a.title.toLowerCase().includes(q) || a.description.toLowerCase().includes(q));
            }
            return ads;
        }
        
        function hasFilters() {
            return state.filters.category || state.filters.city || state.filters.priceMin || state.filters.priceMax || state.filters.search;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="spinner"></span>';
            btn.disabled = true;
            
            try {
                await auth.signInWithEmailAndPassword(form.email.value, form.password.value);
                state.showModal = null;
                showToast(txt('welcome'), 'success');
                form.reset();
            } catch (err) {
                console.error(err);
                showToast(txt('error'), 'error');
            } finally {
                btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> ${txt('login')}`;
                btn.disabled = false;
            }
        }
        
        async function handleRegister(e) {
            e.preventDefault();
            const form = e.target;
            
            if (form.password.value !== form.confirmPassword.value) {
                showToast(txt('passwordMismatch'), 'error');
                return;
            }
            
            const btn = form.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="spinner"></span>';
            btn.disabled = true;
            
            try {
                const result = await auth.createUserWithEmailAndPassword(form.email.value, form.password.value);
                await db.collection('users').doc(result.user.uid).set({
                    name: form.name.value,
                    email: form.email.value,
                    phone: form.phone.value,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    isActive: true
                });
                state.showModal = null;
                showToast(txt('accountCreated'), 'success');
                form.reset();
            } catch (err) {
                console.error(err);
                showToast(txt('error'), 'error');
            } finally {
                btn.innerHTML = `<i class="fas fa-user-plus"></i> ${txt('register')}`;
                btn.disabled = false;
            }
        }

            state.user = null;
            state.showSideMenu = false;
            navigateTo('home');
            showToast(txt('loggedOut'), 'info');
        }
        
        async function handleAddAd(e) {
            e.preventDefault();
            
            if (!state.user) {
                showToast(txt('loginRequired'), 'warning');
                return;
            }
            
            const form = e.target;
            const category = form.category.value;
            const city = form.city.value;
            const title = form.title.value;
            const description = form.description.value;
            const price = form.price.value;
            const phone = form.phone.value;
            const imageInput = document.getElementById('image-input');
            
            if (!category || !city || !title || !description || !price || !phone) {
                showToast(txt('fillFields'), 'error');
                return;
            }
            
            const btn = document.getElementById('submit-ad-btn');
            btn.innerHTML = `<span class="spinner"></span> ${txt('publishing')}`;
            btn.disabled = true;
            
            try {
                let imageUrl = 'https://images.unsplash.com/photo-1586953208448-b95a79798f07?w=400&h=300&fit=crop';
                
                if (imageInput.files && imageInput.files[0]) {
                    const reader = new FileReader();
                    imageUrl = await new Promise((resolve, reject) => {
                        reader.onload = (e) => resolve(e.target.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(imageInput.files[0]);
                    });
                }
                
                const adData = {
                    category,
                    city,
                    title,
                    description,
                    price: parseInt(price),
                    phone,
                    imageUrl,
                    userId: state.user.uid,
                    userName: state.user.name || state.user.email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    isActive: true,
                    isFeatured: false
                };
                
                console.log('Publishing ad:', adData);
                
                const docRef = await db.collection('ads').add(adData);
                console.log('Ad published with ID:', docRef.id);
                
                showToast(txt('adPublished'), 'success');
                state.showModal = null;
                form.reset();
                document.getElementById('image-upload').classList.remove('has-image');
                document.getElementById('image-preview').src = '';
                
                // Reload ads
                await loadAds();
                navigateTo('ads');
                
            } catch (err) {
                console.error('Error publishing ad:', err);
                showToast(txt('error') + ': ' + err.message, 'error');
            } finally {
                btn.innerHTML = `<i class="fas fa-paper-plane"></i> ${txt('publish')}`;
                btn.disabled = false;
            }
        }
        
        async function handleSendMessage(e) {
            e.preventDefault();
            
            if (!state.user || !state.selectedAd) return;
            
            const form = e.target;
            const message = form.message.value;
            
            try {
                await db.collection('messages').add({
                    senderId: state.user.uid,
                    senderName: state.user.name || state.user.email,
                    receiverId: state.selectedAd.userId,
                    receiverName: state.selectedAd.userName,
                    adId: state.selectedAd.id,
                    adTitle: state.selectedAd.title,
                    message,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    isRead: false
                });
                
                showToast(txt('messageSent'), 'success');
                state.showModal = null;
                form.reset();
                render();
            } catch (err) {
                console.error(err);
                showToast(txt('error'), 'error');
            }
        }
        
        async function handleReport(e) {
            e.preventDefault();
            
            if (!state.user) return;
            
            const form = e.target;
            
            try {
                await db.collection('reports').add({
                    reporterId: state.user.uid,
                    reporterName: state.user.name,
                    adId: state.selectedAd?.id,
                    adTitle: state.selectedAd?.title,
                    reason: form.reason.value,
                    details: form.details?.value || '',
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showToast(state.lang === 'ar' ? 'تم إرسال البلاغ' : 'Signalement envoyé', 'success');
                state.showModal = null;
                form.reset();
                render();
            } catch (err) {
                console.error(err);
                showToast(txt('error'), 'error');
            }
        }
        
        async function markAsRead(msgId) {
            try {
                await db.collection('messages').doc(msgId).update({ isRead: true });
                await loadMessages();
                render();
            } catch (err) {
                console.error(err);
            }
        }
        
        // Initialize
        async function init() {
            await Promise.all([loadAds(), loadSliders()]);
            render();
        }
        
        init();
    </script>
</body>
</html>
